port = 8443
local_only = false
mcp_allow_remote = false
scheduler_enabled = false
data_dir = "/data"
adb_path = "/usr/bin/adb"
browser_path = "/usr/bin/chromium"
ffmpeg_path = "/usr/bin/ffmpeg"
scrcpy_server = "/app/assets/scrcpy-server.jar"
decode_frames = true
max_size = 0
bitrate_mbps = 12
fps = 15
idle_power_secs = 300
browser_idle_secs = 1800
log_retain_days = 14
compute_max_concurrency = 4

[auth]
# HTTP Docker entrypoint; HTTPS deployments can set true or GAMER_COOKIE_SECURE=true.
cookie_secure = false
# Initialize this through the local migration/setup command; no default password.
password_hash = ""

[update]
strategy = "off"

[diagnostics]
summary_retain_days = 365
success_detail_retain_days = 14
failure_detail_retain_days = 30
aggregate_repeated_events = true

[trace]
production = true
capture_interval_ms = 10000
success_max_images = 5
retain_hours = 24
failure_retain_hours = 168
run_max_bytes = 67108864
global_max_bytes = 536870912
error_reserve_bytes = 16777216
