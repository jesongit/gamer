# 取色与基础动作（稳定副本，改编自 server/data/com.miHoYo.hkrpg/yaml/测试.yml，
# 补充 wait 区间 / key / tap / swipe / text 覆盖）
config:
  interval: 500ms
  log_level: info
steps:
  - color: [0.7625, 0.9130]
    c74f36:
      - log: "体力亮起"
    else:
      - log: "未亮起"
  - wait: 1h
  - wait: [1s, 3s]
  - key: BACK
  - tap: [0.5, 0.5]
  - swipe:
      fm: [0.5, 0.8]
      to: [0.5, 0.2]
      time: 800ms
  - text: "hello"
