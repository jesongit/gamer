# 每日流程（稳定副本，改编自 server/data/com.miHoYo.hkrpg/yaml/日常遗器.yml，
# 模板名虚拟化、跨文件调用指向 lib_utils.yaml）
steps:
  # 进入手机
  - find: tpl_guide.png
    block: tpl_monthly_claim.png
  - lib_utils:mail_recv

  # 进入每日任务
  - find: tpl_guide.png
  - find: tpl_task_list.png
  - find: tpl_task_done.png
    then:
      - throw: 任务已全部完成
  - find: tpl_task_reward.png # 尝试领取登录奖励
    timeout: 200ms
  - lib_utils:itm_recv        # 领取委托
  - find: tpl_task_goto.png
  # 遗器本
  - lib_utils:ap_burn
  # 领奖
  - find: tpl_phone.png
  - find: tpl_guide.png
  - find: tpl_task_reward.png
    timeout: 500ms
  - find: tpl_task_reward.png
    timeout: 500ms
  - find: tpl_weekly_bonus.png
    timeout: 500ms
