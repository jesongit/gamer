# GameBot 服务端配置（复制为 config.toml 修改）
port = 8443
data_dir = "./data"
adb_path = "adb"
ffmpeg_path = "ffmpeg"
scrcpy_server = "./assets/scrcpy-server.jar"
password = "admin123"
# 脚本引擎默认配置（可被脚本内 config: 段按脚本覆盖）
interval = "500ms"     # 轮询类间隔（find 每轮重试 / verify 复查）；带单位，裸数字非法
threshold = 0.85       # 模板匹配阈值
log_level = "info"     # debug / info / warn / error，低于等级的引擎日志丢弃
decode_frames = true
max_size = 0
bitrate_mbps = 12
fps = 15
# 空闲低功耗秒数（无 viewer 且无脚本运行持续 N 秒后触发）：
# 虚拟屏模式拆 scrcpy 会话（停编码/销毁虚拟屏，adb 保留，下次脚本/投屏自动重连）；
# 镜像模式关物理屏（会话保留，viewer/脚本回来即自动唤醒）；0=关闭
idle_power_secs = 300

# 操作记录 YAML 模板：前端 alt 模式把操作追加到编辑区时使用的格式（可自定义）
# 占位符：
#   {name}     模板名
#   {x}/{y}    点击相对坐标（color 的采样点同用）
#   {fx}/{fy}/{tx}/{ty} 滑动起终点相对坐标
#   {time}     滑动实际时长（ms）
#   {color}    二次裁切区点击处采样的十六进制颜色（color 色值键）
# 搜索区域不再有占位符：由模板名 #后缀（hp#l / xx#0_0_500_500）决定，引擎自动解析
# 生成的操作记录不写等待参数：步骤间不再统一等待，轮询间隔由 config interval 控制
[op_templates]
find = """- find: {name}"""
tap = """- tap: [{x}, {y}]"""
color = """- color: [{x}, {y}]
  {color}:"""
swipe = """- swipe:
    fm: [{fx}, {fy}]
    to: [{tx}, {ty}]
    time: {time}ms"""
