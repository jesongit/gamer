# GameBot 服务端配置示例（复制为 server/config.toml 后按需修改）
#
# 注意：`server/config.toml` 是本机文件（含真实路径/密码），已加入 .gitignore 不再入库；
# 团队分发/评审一律以本示例文件为准。
# 缺失该文件时：GAMER_PROFILE=dev（缺省）放行内置默认值（stderr 有醒目警告）；
# GAMER_PROFILE=prod 直接报错退出。配置存在但解析失败/校验不过时进程即刻终止，
# 错误信息带 TOML 行列位置与逐项违规清单。

# HTTP 监听端口（1-65535）
port = 8443
# 数据目录（SQLite、模板图片、脚本按应用分区存放于其下）
data_dir = "./data"

# 外部工具路径：填 PATH 内的命令名或绝对路径（正斜杠/反斜杠均可）。
#   Windows: "adb"                                  或 "C:/platform-tools/adb.exe"
#   Linux/macOS: "adb"                              或 "/usr/local/bin/adb"
# adb_path = "<PATH 内命令名或绝对路径>"；可执行性启动时探测记录 warn，不阻断
adb_path = "adb"
#   Windows: "ffmpeg"                               或 "D:/Scoop/apps/ffmpeg/current/bin/ffmpeg.exe"
#   Linux: "/usr/bin/ffmpeg"    macOS(brew): "/opt/homebrew/bin/ffmpeg"
# ffmpeg_path = "<PATH 内命令名或绝对路径>"；帧缓存软解码用，失效会导致截图/匹配不可用
ffmpeg_path = "ffmpeg"

# scrcpy-server jar 路径——启动必检，文件缺失直接退出（相对路径相对服务端工作目录）
scrcpy_server = "./assets/scrcpy-server.jar"
# 管理登录密码（兼容旧明文口令）——务必在本机文件里改成自己的强密码（勿提交）；
# 更安全的凭据来源见下方 [auth] 段说明（环境变量 / password_hash 优先于本字段）
password = "admin123"

# 脚本引擎默认配置（可被脚本内 config: 段按脚本覆盖）
interval = "500ms"     # 轮询类间隔（find 每轮重试 / verify 复查）；带单位 ms/s/m/min/h/d，裸数字非法
threshold = 0.85       # 模板匹配阈值，(0, 1]
log_level = "info"     # debug / info / warn / error，低于等级的引擎日志丢弃
decode_frames = true
max_size = 0           # scrcpy 最大分辨率（0=原始；非 0 时须为 8 的倍数且 [16,4096]）
bitrate_mbps = 12      # 码率上限区间 [1,50]：过高会挤占 WebRTC 发送帧预算导致投屏积压冻结
fps = 15               # 帧率上限（0 = 设备默认；≤120）

# 空闲低功耗秒数（无 viewer 且无脚本运行持续 N 秒后触发）：
# 虚拟屏模式拆 scrcpy 会话（停编码/销毁虚拟屏，adb 保留，下次脚本/投屏自动重连）；
# 镜像模式关物理屏（会话保留，viewer/脚本回来即自动唤醒）；0=关闭
idle_power_secs = 300

# 服务端文件日志保留天数（GB_LOG 指向文件时生效）：按天滚动产出
# gamer-server.log.YYYY-MM-DD，超出窗口的旧日期文件在启动与每日零点各清理一次；
# 0 = 永不清理
log_retain_days = 14

# 专用计算池并发上限：NCC 模板匹配 / PNG 解码等 CPU 密集工作在独立线程池
# 执行，不占 Tokio 核心线程（多设备并发脚本时 API 与控制消息保持可响应）。
# 该值同时限制池线程数与在途任务数（池满时排队等待，不丢弃不报错）；
# 显式值上限 256。0 或缺省 = 按 CPU 核数自动
compute_max_concurrency = 0

# 操作记录 YAML 模板：前端 alt 模式把操作追加到编辑区时使用的格式（可自定义）
# 占位符：
#   {name}     模板名
#   {x}/{y}    点击相对坐标（color 的采样点同用）
#   {fx}/{fy}/{tx}/{ty} 滑动起终点相对坐标
#   {time}     滑动实际时长（ms）
#   {color}    二次裁切区点击处采样的十六进制颜色（color 色值键）
# 搜索区域不再有占位符：由模板名 #后缀（hp#l / xx#0_0_500_500）决定，引擎自动解析
# 生成的操作记录不写等待参数：步骤间不再统一等待，轮询间隔由 config interval 控制
[op_templates]
find = """- find: {name}"""
tap = """- tap: [{x}, {y}]"""
color = """- color: [{x}, {y}]
  {color}:"""
swipe = """- swipe:
    fm: [{fx}, {fy}]
    to: [{tx}, {ty}]
    time: {time}ms"""

# 鉴权与会话治理（阶段 2）。REST/WS 除登录三端点外全部要求浏览器会话 Cookie；
# gamer.ps1 走「回环 + X-Admin-Token」本机管理通道优雅停机。
# 管理口令来源优先级：环境变量 GAMER_ADMIN_PASSWORD > 本段 password_hash > 上面
# 的明文 password 字段。哈希格式 `sha256$salt$hex`（salt ≥8 字节与
# sha256(salt||password) 均 hex 编码），生成示例（PowerShell，替换尖括号内容）：
#   $saltHex = "aabbccdd11223344"   # 换成自己的随机 8+ 字节
#   $bytes   = [byte[]]-split ($saltHex -replace '..', '0x$& ') +
#              [Text.Encoding]::UTF8.GetBytes('<你的密码>')
#   $digest  = ([System.Security.Cryptography.SHA256]::Create()).ComputeHash($bytes)
#   "sha256`$$saltHex`$" + (($digest | ForEach-Object { $_.ToString('x2') }) -join '')
[auth]
session_abs_secs = 43200   # 会话绝对有效期（秒）：自登录起算强制重登；范围 [60, 2592000]
session_idle_secs = 7200   # 会话空闲有效期（秒）：每次认证请求续期；范围 [60, 604800]
login_max_fails = 10       # 同一来源 IP 登录失败次数上限（窗口内），触发后 429 直至滑出
login_window_secs = 300    # 登录限流滑动窗口宽度（秒），[1, 86400]
password_hash = ""         # 留空 = 不启用哈希链路；格式非法启动即退出

# 回环管理通道（gamer.ps1 stop / 运维脚本用）：请求头 X-Admin-Token 且来源 IP 为回环。
# 令牌来源环境变量 GAMER_ADMIN_TOKEN；dev profile 未设置时启动自动生成并打 WARN
# （仅对回环生效）；prod 未设置则通道禁用。脚本对接见 gamer.ps1。
