[package]
name = "gamer-server"
version = "0.1.1"
edition = "2021"
description = "GameBot 游戏自动化助手服务端：scrcpy 设备控制 + WebRTC 推流 + 模板匹配 + YAML 自动化 + 定时任务"

[features]
default = []
# The first extension phase keeps WASM execution opt-in. The default server
# does not carry or initialize a WASM engine.
wasm-runtime = ["dep:wasmtime"]

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
# gate 路由的完整路由换入转发（ServiceExt::oneshot）；dev 同版本复用
tower = { version = "0.4", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按天滚动文件日志 + 非阻塞 worker（OPS-003）
tracing-appender = { version = "0.2", features = ["parking_lot"] }

# WebRTC
webrtc = "0.13"

# 图像处理（模板匹配）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"

# 定时任务
cron = "0.12"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 工具
anyhow = "1"
# webrtc_util::conn::Conn 的 async trait 实现（webrtc/rtc_net.rs 媒体 UDP 端口包装）
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
futures-util = "0.3"
parking_lot = "0.12"
bytes = "1"
async-recursion = "1"

# Optional and intentionally not enabled by default. When enabled, this is the
# Component Model runtime for the checked-in WIT world; the Engine remains
# lazy and is created only when an installed extension is started.
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "async", "component-model"] }

# 脚本包导出/导入（zip）
zip = "2"

# script_v2 严格装载：事件级解析携带标量样式与 Span（契约见 docs/SCRIPT_EDITOR_CONTRACT.md）
saphyr-parser = "0.0.12"

[dev-dependencies]
tempfile = "3"
wat = "1"
wit-component = "0.254.0"
# router 集成测试用 oneshot 驱动（tower ServiceExt）
tower = { version = "0.4", features = ["util"] }
