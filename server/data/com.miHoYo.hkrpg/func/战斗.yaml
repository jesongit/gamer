饰品提取:
  steps:
    - check: 饰品提取界面.png
      throw: 非饰品提取界面
    - find: 饰品提取空队伍.png
      timeout: 1s
      then:
        - find: 预设编队.png
        - tap: [0.175, 0.2528]
    - func: 战斗/次数选择
      then:
        - find: 开始挑战.png
      else:
        - find: 关闭界面.png
          block:
            - 返回.png

次数选择:
  steps:
    - find: 快捷体力按钮.png
      timeout: 100ms
    - match:
      - 体力不足.png:
        - return: false
    - loop:
        times: 24
        steps:
          - find: 增加次数.png
          - wait: 200ms
          - match:
            - 体力不足.png:
              - find: 减少次数.png
              - break

拟造花萼:
  steps:
    - check: 拟造花萼.png
      throw: 非拟造花萼界面
    - func: 战斗/次数选择
      then:
        - find: 挑战副本.png
        - find: 开始挑战.png
        - find: 退出关卡.png
        - find: 关闭界面.png
      else:
        - find: 关闭界面.png
        - find: 关闭界面.png

通用战斗:
  steps:
    - match:
      - 拟造花萼.png:
        - func: 战斗/拟造花萼
      - 饰品提取界面.png:
        - func: 战斗/饰品提取
      - 凝滞虚影.png:
        - func: 战斗/凝滞虚影

凝滞虚影:
  steps:
    - func: 战斗/次数选择
      then:
        - find: 挑战副本.png
      else:
        - find: 关闭界面.png
