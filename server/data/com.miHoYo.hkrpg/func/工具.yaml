登录:
  params:
    - 'tmpl:account:账号模板:账号155.png'
  steps:
    - str_app
    - find: 登录按钮.png
      block:
        - 关闭登录.png
    - find: 切换账号.png
      block:
        - 确认登出.png
    - find: $account
    - find: 进入游戏.png
    - find: 开始游戏.png
    - find: 点击进入.png
    - match:
      - 领取月卡.png:
          click: true
          steps:
            - find: 领取月卡.png
            - return: true
      - 手机图标.png: []
      timeout: 5min
    - find: 领取月卡.png
      timeout: 3s
      then:
        - find: 领取月卡.png

每日任务:
  steps:
    - check: 手机图标.png
    - find: 指南.png
    - find: 每日任务列表.png
      timeout: 3s
      then:
        - loop:
            times: 5
            steps:
              - match:
                - 每日任务领取.png:
                    click: true
                - 每日任务前往.png:
                    click: true
                    steps:
                      - func: 工具/每日任务前往
                - 每日任务达标奖励.png:
                    click: true
                    steps:
                      - find: 点击空白关闭1.png
                      - find: 关闭界面.png
                      - break
                - 每日任务完成.png:
                  - find: 关闭界面.png
                  - break
      else:
        - find: 关闭界面.png
        - return: false

每日任务前往:
  steps:
    - match:
      - 委托界面.png:
        - find: 领取委托.png
        - find: 点击空白关闭1.png
        - find: 关闭界面.png
      - 生存索引.png:
        - find: 培养目标.png
        - find: 角色培养进入.png
        - func: 工具/通用战斗
        - find: 指南.png

通用战斗:
  steps:
    - find: 饰品提取空队伍.png
      timeout: 1s
      then:
        - find: 预设编队.png
        - tap: [0.1932, 0.2815]
        - find: 返回.png
    - find: 快捷体力按钮.png
      timeout: 100ms
    - match:
      - 体力不足.png:
        - return: false
    - loop:
        times: 24
        steps:
          - find: 增加次数.png
          - match:
            - 体力不足.png:
              - find: 减少次数.png
              - break
            - 次数上限.png:
              - break
    - find: 开始挑战.png
      block:
        - 挑战副本.png
      then:
        - find: 退出关卡.png
        - find: 关闭界面.png

邮件领取:
  steps:
    - find: 手机图标.png
      timeout: 2s
      else:
        - return: false
    - find: 邮件图标.png
      timeout: 2s
      else:
        - find: 关闭界面.png
        - return: false
    - find: 领取邮件.png
      timeout: 2s
      then:
        - find: 点击空白关闭1.png
    - find: 关闭界面.png
    - find: 关闭界面.png
