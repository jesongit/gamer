登录:
  params:
    - 'tmpl:account:账号模板:账号155.png'
  steps:
    - str_app
    - find: 登录按钮.png
      block:
        - 关闭登录.png
    - find: 切换账号.png
      block:
        - 确认登出.png
    - find: $account
    - find: 进入游戏.png
    - find: 开始游戏.png
    - find: 点击进入.png
    - find: 领取月卡.png
      verify: true
    - match:
      - 手机图标.png:
        - log: 登录成功
      else:
        - throw: 未知界面
      timeout: 10s

每日任务:
  steps:
    - check: 手机图标.png
      throw: 非主界面，无法开始每日任务
    - find: 指南.png
    - find: 每日任务列表.png
    - match:
      - 每日任务领取.png:
          click: true
      - 每日任务前往.png:
          click: true
      else:
        - find: 关闭界面.png
        - return: true
      timeout: 3s
    - log: 已进入委托或生存索引
    - match:
      - 委托界面.png:
        - find: 领取委托.png
          timeout: 100ms
        - find: 关闭界面.png
      - 培养目标.png:
          click: true
          steps:
            - find: 角色培养进入.png
            - log: 调用进入战斗逻辑
