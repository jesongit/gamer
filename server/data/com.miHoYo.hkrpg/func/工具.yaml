登录:
  params:
    - 'tmpl:account:账号模板:账号155.png'
  steps:
    - str_app
    - find: 登录按钮.png
      block:
        - 关闭登录.png
    - find: 切换账号.png
      block:
        - 确认登出.png
    - find: $account
    - find: 进入游戏.png
    - find: 开始游戏.png
    - find: 点击进入.png
    - find: 手机图标.png
      block:
        - 领取月卡.png
      then:
        - find: 关闭界面.png

每日任务:
  steps:
    - check: 手机图标.png
      throw: 非主界面，无法开始每日任务
    - find: 指南.png
    - find: 每日任务列表.png
      then:
        - loop:
            times: 5
            steps:
              - match:
                - 每日任务领取.png:
                    click: true
                - 每日任务前往.png:
                    click: true
                    steps:
                      - match:
                        - 委托界面.png:
                          - find: 领取委托.png
                            timeout: 1s
                          - find: 点击空白关闭1.png
                          - find: 关闭界面.png
                        - 生存索引.png:
                          - find: 培养目标.png
                          - find: 角色培养进入.png
                          - wait: 1s
                          - func: 战斗/通用战斗
                          - find: 关闭界面.png
                        else:
                          - find: 关闭界面.png
                - 每日任务达标奖励.png:
                    click: true
                    steps:
                      - find: 关闭界面.png
                      - find: 关闭界面.png
                      - break
                - 每日任务完成.png:
                  - find: 关闭界面.png
                  - break
      else:
        - return: false
