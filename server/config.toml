# GameBot 本机开发配置
port = 8443
data_dir = "./data"
adb_path = "adb"
ffmpeg_path = "D:/Scoop/apps/ffmpeg/current/bin/ffmpeg.exe"
scrcpy_server = "./assets/scrcpy-server.jar"
password = "admin123"
default_threshold = 0.8
decode_frames = true
max_size = 0
bitrate_mbps = 20
fps = 15

# 操作记录 YAML 模板：前端 alt 模式把操作追加到编辑区时使用的格式（可自定义）
# 占位符：
#   {name}     模板名
#   {region}   区域块（region: a 或 region: {fm: [x1,y1], to: [x2,y2]}）
#   {x}/{y}    点击相对坐标
#   {fx}/{fy}/{tx}/{ty} 滑动起终点相对坐标
#   {time}     滑动实际时长（ms）
#   {cx}/{cy}  模板图内相对百分比坐标（find 的 click 参数）
# 生成的操作记录不写 wait 参数：操作后等待由脚本顶层 action_wait 统一控制，需要个别覆盖时手动加 wait
[op_templates]
find = """- find: {name}
  {region}
  click: true"""
find_wait = """- find: {name}
  timeout: 0
  {region}
  click: true"""
find_click_pos = """- find: {name}
  {region}
  click: [{cx}, {cy}]"""
tap = """- tap: [{x}, {y}]"""
swipe = """- swipe:
    fm: [{fx}, {fy}]
    to: [{tx}, {ty}]
    time: {time}"""
swipe_region = """region:
  fm: [{fx}, {fy}]
  to: [{tx}, {ty}]"""
