# GameBot 本机开发配置
port = 8443
data_dir = "./data"
adb_path = "adb"
ffmpeg_path = "D:/Scoop/apps/ffmpeg/current/bin/ffmpeg.exe"
scrcpy_server = "./assets/scrcpy-server.jar"
password = "admin123"
default_threshold = 0.8
decode_frames = true
max_size = 0
# 码率：不宜超 ~12——设备虚拟屏固定 60fps 编码，40Mbps 时单帧 50~75KB，
# pusher 单帧 RTP 发送 ~20ms > 16.7ms 帧预算 → 发送饱和积压 → 周期性
# 断链清队冻结（投屏延迟高的根因之一）。12Mbps 下单帧 ~20KB、发送 ~6ms
bitrate_mbps = 12
fps = 15
# scrcpy 编码器名（空=设备默认；可指定 c2.android.avc.encoder 软件编码器避开 MTK 硬件块效应）
encoder_name = ""
# 编码器块效应诊断探针（默认关，见 config.rs 注释）
probe_encoder = false
# 空闲低功耗秒数（无 viewer 且无脚本运行持续 N 秒后触发）：
# 虚拟屏模式拆 scrcpy 会话（停编码/销毁虚拟屏，adb 保留，下次脚本/投屏自动重连 ~2-4s）；
# 镜像模式关物理屏（会话保留，viewer/脚本回来即自动唤醒）；0=关闭
idle_power_secs = 300

# 操作记录 YAML 模板：前端 alt 模式把操作追加到编辑区时使用的格式（可自定义）
# 占位符：
#   {name}     模板名
#   {x}/{y}    点击相对坐标
#   {fx}/{fy}/{tx}/{ty} 滑动起终点相对坐标
#   {time}     滑动实际时长（ms）
#   {cx}/{cy}  模板图内相对百分比坐标（find 的 click 参数）
#   {color}    alt 点击采样的十六进制颜色（color 记录）
# 搜索区域不再有占位符：由模板名 #后缀（hp#l / xx#0_0_500_500）决定，引擎自动解析
# 生成的操作记录不写 wait 参数：操作后等待由脚本顶层 action_wait 统一控制，需要个别覆盖时手动加 wait
[op_templates]
find = """- find: {name}"""
until = """- until: {name}"""
find_click_pos = """- find: {name}
  click: [{cx}, {cy}]"""
tap = """- tap: [{x}, {y}]"""
color = """- color: [{x}, {y}]
  check: {color}
  then:
    - click:"""
swipe = """- swipe:
    fm: [{fx}, {fy}]
    to: [{tx}, {ty}]
    time: {time}"""
swipe_region = """region:
  fm: [{fx}, {fy}]
  to: [{tx}, {ty}]"""
