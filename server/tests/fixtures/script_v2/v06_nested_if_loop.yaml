params:
  - 'bool:enable:是否启用:true'
  - 'bool:retry:允许重试:false'
steps:
  - loop:
      times: 3
      steps:
        - if: $retry
          then:
            - find: retry.png
              block:
                - popup.png
                - dialog.png
              verify: true
              then:
                - log: 清理障碍
                - tap: [0.5, 0.5]
          else:
            - log: 无障碍物
  - if: $enable
    then:
      - loop:
          steps:
            - wait: 1s
    else:
      - log: 已禁用
