# -----------------------------------------------------------------------------
# ffmpeg —— BtbN win64-lgpl 静态构建（LGPL，禁 gpl/nonfree）
# 来源与履约清单: dependency-licensing.md §2（ffmpeg.org/legal.html 合规项）
# -----------------------------------------------------------------------------
[[component]]
id = "ffmpeg"
description = "FFmpeg Windows x64 静态构建（BtbN/FFmpeg-Builds win64-lgpl，单文件 bin/ffmpeg.exe）"
version = "N-126335-gb32f8d1c23-20260830"
version_source = "ffmpeg.exe -version 首行版本串（N-<rev>-g<commit>-<date>，含 FFmpeg commit b32f8d1c23）"
