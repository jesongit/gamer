source_size = 8044989
package_filter = "仅原样提取 adb.exe / AdbWinApi.dll / AdbWinUsbApi.dll 三件；fastboot 等其余文件不属于本项目运行面，不入包，不改任何字节"
license = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
license_note = "包内 NOTICE.txt 首行声明 Apache License 2.0；Android SDK 条款 §3.5 规定开源许可组件仅受其开源许可管辖（ARC-005 §1.2 依据链）"
notice = "随 full 包附 Apache-2.0 全文与归属（Copyright The Android Open Source Project）；逐文件 sha256 与 manifest components[id=adb].required_files 保持一致（DEP-005 生成）"
build_params = "Google 官方预编译产物，无构建参数；重打包仅允许从官方 zip 原字节提取裁剪"
verify_hint = "release/packaging/fetch-adb.ps1（默认=下载裁包，-VerifyOnly=只校验 vendor）；手动: vendor/adb/37.0.1/adb.exe version 应输出 'Version 37.0.1-...'"
verify_command = "powershell -NoProfile -ExecutionPolicy Bypass -File release/packaging/fetch-adb.ps1 -VerifyOnly"
