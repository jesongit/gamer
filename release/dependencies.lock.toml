source_offer = "https://github.com/FFmpeg/FFmpeg/archive/b32f8d1c23.tar.gz（与版本串 commit 对应；首发随发布资产提供直链）"
verify_hint = "release/packaging/fetch-ffmpeg.ps1（默认=下载+三道验收+H.264 冒烟，-VerifyOnly=只校验 vendor 与红线）；手动: ffmpeg.exe -version / -hide_banner -buildconf / -L"
verify_command = "powershell -NoProfile -ExecutionPolicy Bypass -File release/packaging/fetch-ffmpeg.ps1 -VerifyOnly"
locked_at = "2026-08-31"

