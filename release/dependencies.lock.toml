source_artifact_name = "ffmpeg-master-latest-win64-lgpl.zip"
source_url_note = "latest 为滚动 tag；本条目以锁定时点产物 hash 固化（2026-08-31 下载复核与 ARC-005 记录一致），后续修复/重装从 seed 取该产物，不追 latest"
source_sha256 = "c55a9c349ef915565c5755473d858c98d80d96feefe693fe6ab38705d29c920e"
source_size = 148537845
package_filter = "仅保留 zip 内 */bin/ffmpeg.exe；ffprobe/ffplay/doc/presets 不入包（dependency-licensing.md §2.2 第 4 条）"
license = "LGPL-3.0-or-later"
license_url = "https://www.gnu.org/licenses/lgpl-3.0.html"
license_note = "构建带 --enable-version3，-L 输出 GNU Lesser General Public License v3+；本项目以 subprocess 管道聚合调用，义务只针对随包分发的 ffmpeg.exe（ARC-005 §2.3）"
notice = "LGPL 履约: 随包附 LGPL-3.0 全文 + 与 commit b32f8d1c23 精确对应的源码 offer + BUILD-CONFIG.txt（-buildconf 归档）+ 发布页归属声明；严禁 GPL/nonfree 构建冒充分发（红线，见 §5）"
build_params = "buildconf 关键行: --enable-version3 --disable-libx264 --disable-libx265 --disable-libxvid --disable-libfdk-aac --enable-libopenh264；完整 -buildconf 输出由 fetch-ffmpeg.ps1 归档到 vendor BUILD-CONFIG.txt"
