# =============================================================================
# GameBot 运行依赖锁文件（release/dependencies.lock.toml）
# =============================================================================
# 任务: AUTO_UPDATE_DEVELOPMENT_PLAN §7.4 DEP-001（依赖与发布轨）
# 决策: release/contracts/dependency-licensing.md（ARC-005，已评审基线）
#
# 用途:
#   - 固定每个 Windows 运行依赖（adb / ffmpeg / scrcpy-server）的版本、来源 URL、
#     整包 sha256、逐产物文件 sha256+size、许可与 NOTICE 要求、构建参数与校验方式。
#   - fetch 脚本（release/packaging/fetch-*.ps1）与发布门禁脚本
#     （tools/check-scrcpy-binding.ps1）以本文件为唯一事实源。
#
# 格式约定（供 LockFile.psm1 的行级解析器使用，扩展时保持简单键值）:
#   - 顶层: schema_version、locked_at
#   - 每个依赖一个 [[component]]；其产物文件用 [[component.files]] 列出
#     （path 为组件目录内相对路径；size 单位字节；sha256 一律小写 hex）
#
# 更新策略:
#   - adb: 官方 latest 入口滚动；重新锁定时须核对 zip 内 source.properties 的
#     Pkg.Revision 与包 sha256，并按 ARC-005 §1 重走许可确认。
#   - ffmpeg: BtbN `latest` 为滚动 tag，资产会被覆盖；重装/修复一律取已锁定产物
#     seed，不得反复追 latest。换新构建必须重走 ARC-005 §2.2 全部验收门禁
#     （buildconf 无 gpl/nonfree、-L 为 LGPL、H.264 stdin→PNG 冒烟）。
#   - scrcpy-server: 与应用协议版本强绑定，不独立升级；变更须同步
#     server/src/device/scrcpy.rs 常量与 manifest（tools/check-scrcpy-binding.ps1 强制）。
# =============================================================================

schema_version = 1
locked_at = "2026-08-31"

