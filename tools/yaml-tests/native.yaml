# Isolated engine test fixture; complete visual tasks must declare finish.
name: YAML 原生函数验收（仅限测试设备）
run:
  - list_length: {items: [first, second]}
    as: item_count
  - list_get: {items: [first, second], index: 1}
    as: second_item
  - number: {text: "60 / 300", index: 0, format: fraction}
    as: stamina_number
  - calculate: {op: floor_div, a: $stamina_number, b: 10}
    as: stamina_batches
  - launch: {}
  - tap: [0.25, 0.75]
  - swipe:
      from: [0.1, 0.9]
      to: [0.9, 0.1]
      duration: 1ms
  - press: {position: [0.11, 0.07], duration: 800ms}
  - key: HOME
  - input_text: yaml-acceptance
  - sleep: 0ms
  - log:
      message: {status: ready, literal: $$price}
      level: info
  - find: button.png
    as: first
  - tap: $first.center
  - wait_find:
      template: button.png
      click: false
      timeout: 2s
      interval: 50ms
      region: [0, 0, 1, 1]
    as: appeared
  - tap_template: button.png
    as: clicked
  - wait_disappear:
      template: button.png
      timeout: 2s
      interval: 50ms
    as: gone
  - eq: {a: 1, b: 1.0}
    as: equal
  - ne: {a: false, b: null}
    as: unequal
  - gt: {a: 3, b: 2}
    as: greater
  - ge: {a: 2, b: 2}
    as: greater_equal
  - lt: {a: 1, b: 2}
    as: less
  - le: {a: 2, b: 2}
    as: less_equal
  - find_any: [button.png]
  - notify:
      title: 通知测试
      content: 原生函数验收
  - stop_app: {}
  - reset_input: {}
  - return:
      center: $first.center
      appeared: $appeared.center
      clicked: $clicked.center
      gone: $gone
      comparisons: [$equal, $unequal, $greater, $greater_equal, $less, $less_equal]
      stamina: $stamina_number
      batches: $stamina_batches
