[package]
name = "gamer-ocr-compat-probe"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
yaml-interp = { path = "../../../plugins/gamer-yaml/interpreter" }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
