manifest_version = 1
id = "gamer.yaml"
version = "3.0.0"
name = "Gamer YAML vNext"
description = "Surface YAML v3 lowering and execution guest"
entry = "plugin.wasm"
permissions = ["device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "vision.match", "vision.color", "resource.read", "runtime.sleep", "log.write"]

[host_api]
device = "^1.0"
vision = "^1.0"
input = "^1.0"
resource = "^1.0"
runtime = "^1.0"
log = "^1.0"

[[ui.contributions]]
panel_id = "automation"
title = "自动化"
icon = "⚙️"
order = 25
location = "console.right"
runtime = "iframe"
requires_device = true
preferred_width = 440
entry = "ui/automation.html"

[[ui.contributions]]
panel_id = "functions"
title = "函数"
icon = "ƒ"
order = 30
location = "console.right"
runtime = "iframe"
requires_device = false
preferred_width = 440
entry = "ui/functions.html"
