# GameBot 本机并存部署 overlay：Docker 实例（宿主 8444）与本地开发实例（8443 / 5173 dev）并存
#
# 用途：与 docker-compose.yml 叠加使用，为 Docker 实例提供独立数据目录 docker-data/
#      与独立端口（host 网络 + 容器内配置监听 8444），绝不触碰开发实例的 server/data
#      与 8443 服务（两实例共享数据目录会抢设备 scrcpy 会话、定时任务双跑）。
#      ports / volumes / healthcheck / network_mode 用 !override 整体替换主文件对应项。
#
# 为什么必须 host 网络：WebRTC 媒体流（RTP/UDP）靠 ICE 候选直连，bridge 网络的
# 候选是容器内网 172.x，宿主浏览器不可达 → 信令（WS）通但视频黑屏。host 网络下
# 候选即宿主 IP，浏览器直达。代价是容器内服务必须换端口（docker-config.toml
# port=8444）避开开发实例的 8443。
#
# 设备接入（共享宿主 adb server 方案，详见 docs/DEVICE_ACCESS.md）：宿主以
# -a 模式常驻 adb server（tools/adb-share-start.ps1，监听 0.0.0.0:5037），容器内
# adb 客户端经 ADB_SERVER_SOCKET 复用它，USB/无线设备天然全可见；容器内不挂载
# adbkey（配对密钥在宿主侧，挂进来无用且混淆）。
#
# 数据目录准备（种子 = server/data 下各应用分区 <pkg>/{tmpl,yaml}，不含 gamer.db* /
# pending_restore.json，Docker 实例自建自己的数据库）：
#   mkdir -p docker-data && cp -r server/data/<pkg>… docker-data/
#
# 启动（构建 + 起容器；redroid 带 profile，不会被拉起）：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# 停止：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml down
#
# 登录：docker-config.toml 未配密码 → GAMER_PROFILE 缺省 dev → 默认凭据 admin/admin123

services:
  gamer:
    image: gamer:deploy
    container_name: gamer-server-docker
    # 注意：曾尝试 network_mode: host 修复 WebRTC 黑屏（bridge 候选 172.x 浏览器不可达），
    # 但 Docker Desktop 的 host networking 未在设置启用时不生效（宿主访问不到容器端口）。
    # 当前方案：bridge + TCP/UDP 双映射 + 服务端 rtc_external_ip/rtc_udp_port 配置
    # （见 docker-config.toml）宣告宿主可达的 ICE 候选。
    ports: !override
      - "8444:8443"
      - "8444:8443/udp"
    volumes: !override
      # 独立数据目录：与开发实例 server/data 完全隔离
      - ./docker-data:/app/data
      # 容器专用配置：port=8444 + 容器内工具路径；rtc_* 三键当前由并行 WebRTC
      # 出画修复工作持有（保持生效），修复落地后按 docs/DEVICE_ACCESS.md 处置
      - ./docker-config.toml:/app/config.toml:ro
      # adb 密钥不再挂载：共享宿主 adb server 模式下配对在宿主侧完成
    healthcheck: !override
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8443/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment: !override
      - GB_CONFIG=/app/config.toml
      # 共享宿主 adb server：容器内每次 spawn 的 adb 客户端进程全部打到宿主 server
      # （宿主需先跑 tools/adb-share-start.ps1；server 被 kill 或重启机器后需重跑）
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    # build / restart 策略复用主文件定义
