# GameBot 本机并存部署 overlay：Docker 实例（宿主 8444）与本地开发实例（8443 / 5173 dev）并存
#
# 【当前模式：无线调试直连】容器内运行自己的 adb server（挂载 Windows 已配对的
# adbkey，手机信任该密钥无需配对码），adb reverse 隧道在容器内闭环——scrcpy
# 实时会话（投屏/截图/控制）可用。WebRTC 出画三件套已就位：
#   1. docker-config.toml 的 rtc_external_ip/rtc_udp_port/rtc_external_port
#      （bridge 网络下宣告宿主可达的 ICE 候选，UDP 经 8444:8443/udp 映射）
#   2. 前端 offer 等 ICE 候选收集完成再发送（b245cfb）
#   3. ICE 候选 local_addr 具体化（1c6827d）
# 实测：checking→connected 约 10ms，浏览器解出 1920x1080 真实画面（零丢帧）。
#
# 注意：
# - 手机「无线调试」端口每次重新开启都会变化，设备连接地址需随之更新
# - 熄屏/深睡或 adb server 重启会掉无线连接，重新 connect 即可（密钥已互信）
# - 备选模式「共享宿主 adb server」（adb 层共享但 reverse 隧道死结致容器内无
#   实时会话）见 git 历史 b2dedc7 与 docs/DEVICE_ACCESS.md 的方案对比
#
# 数据目录准备（种子 = server/data 下各应用分区 <pkg>/{tmpl,yaml}，不含 gamer.db*）：
#   mkdir -p docker-data && cp -r server/data/<pkg>… docker-data/
#
# 启动（构建 + 起容器；redroid 带 profile，不会被拉起）：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# 停止：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml down
#
# 登录：docker-config.toml 未配密码 → GAMER_PROFILE 缺省 dev → 默认凭据 admin/admin123

services:
  gamer:
    image: gamer:deploy
    container_name: gamer-server-docker
    # bridge + TCP/UDP 双映射：WebRTC 媒体候选经 docker-config.toml 的 rtc_*
    # 三键宣告宿主可达地址（127.0.0.1:8444），UDP 媒体流走 8444:8443/udp 映射
    ports: !override
      - "8444:8443"
      - "8444:8443/udp"
    volumes: !override
      # 独立数据目录：与开发实例 server/data 完全隔离
      - ./docker-data:/app/data
      # 容器专用配置：port=8443 + 容器内工具路径 + ICE 候选宣告（出画修复）
      - ./docker-config.toml:/app/config.toml:ro
      # 无线调试连接：复用 Windows 已配对的 adb 密钥（USB 授权即互信），
      # 容器内 adb connect <ip:port> 免配对码；reverse 隧道在容器内闭环
      - C:/Users/Jeson/.android/adbkey:/root/.android/adbkey:ro
      - C:/Users/Jeson/.android/adbkey.pub:/root/.android/adbkey.pub:ro
    healthcheck: !override
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8443/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # build / environment(GB_CONFIG) / restart 策略复用主文件定义
