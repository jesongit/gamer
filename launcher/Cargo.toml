[package]
name = "gamer-launcher"
version = "0.2.0-beta.1"
edition = "2021"
description = "Gamer 便携安装启动器/升级器（单实例锁、原子 state、release manifest 校验）"
publish = false

# 独立 crate：不加入任何 workspace，也不吸收子目录
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Console",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "gamer_launcher"
path = "src/lib.rs"

[[bin]]
name = "gamer-launcher"
path = "src/main.rs"

[dev-dependencies]
crc32fast = "1"
