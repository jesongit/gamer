<body><form id="example" class="gamer-fields"><label for="message">文本</label><input id="message" value="示例内容" required><span>操作</span><button type="button" class="gamer-primary" id="submit" disabled>展示操作结果</button></form><p class="gamer-note" id="connection" role="status">连接宿主…</p><p class="gamer-error" id="error" role="alert"></p><details><summary>更多参数</summary><p class="gamer-note">简单字段保持紧凑，非必填内容放在折叠区域。</p></details><script>// Generated by tools/build-ui-sdk.mjs

    if (disposed || port || event.source !== window.parent || event.data?.type !== 'gamer-ui:connect' || event.data.version !== 'gamer-ui@1' || !event.ports[0]) return

      else request.reject(Object.assign(new Error(data.error?.message || '请求失败'), { code: data.error?.code }))
    }

  }
  window.addEventListener('message', onConnect)
  async function call(method, params) {
    await ready
    if (disposed) throw new Error('面板已关闭')
    const id = String(++serial)
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('请求超时')) }, timeout)
      pending.set(id, { resolve, reject, timer })
      port.postMessage({ type: 'gamer-ui:request', version: 'gamer-ui@1', id, method, params })
    })
  }
  function dispose() {
    disposed = true; clearTimeout(timer); rejectReady(new Error('面板已关闭'))
    window.removeEventListener('message', onConnect); port?.close()
    for (const request of pending.values()) { clearTimeout(request.timer); request.reject(new Error('面板已关闭')) }

function applyGamerTheme(theme, root = document.documentElement) {
  const colors = { background: 'surface', field: 'field', text: 'text', secondaryText: 'muted', border: 'border', accent: 'accent' }
  for (const [key, token] of Object.entries(colors)) {

(async () => {
const { connectGamer, applyGamerTheme } = window.GamerUI
const client = connectGamer()
const error = document.querySelector('#error')
try {
  const context = await client.call('context.get')
  applyGamerTheme(context.theme)
  document.querySelector('#connection').textContent = '已连接 · 操作结果显示在宿主右侧状态条'
  document.querySelector('#submit').disabled = false
} catch (e) { error.textContent = e.message }
document.querySelector('#submit').addEventListener('click', async event => {
  event.preventDefault(); error.textContent = ''
  const text = document.querySelector('#message').value
  try {
    const accepted = await client.call('status.set', { text: '文本已准备', actions: [{ label: '复制', copy: text }, { label: '详情', detail: text }] })
    if (!accepted) throw new Error('当前面板已失效，请重新打开')
  }
  catch (e) { error.textContent = e.message }
})
window.addEventListener('pagehide', () => client.dispose(), { once: true })
