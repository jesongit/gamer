# USB 物理设备直通 override（Linux 宿主机场景）
#
# 用法（必须与主 compose 文件叠加）：
#   docker compose -f docker-compose.yml -f docker-compose.usb.yml up -d
#
# 容器进程默认以 root 运行，device 映射后的 USB 节点可直接读写，
# 无需 privileged；若宿主 udev 权限不足再自行追加 group_add/privileged。
# 注意：Docker Desktop（Windows/macOS）无法把宿主 USB 设备直通进容器。
services:
  gamer:
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
