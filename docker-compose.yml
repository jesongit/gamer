# GameBot 一键部署：服务端 + redroid 云手机（可选）

services:
  gamer:
    # 根上下文一体化构建：前端 + 服务端打进一个镜像（见仓库根 Dockerfile）
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamer-server
    ports:
      - "8443:8443"
      # 固定 WebRTC 媒体端口；若使用自定义 rtc_udp_port，容器侧端口必须同步修改。
      # GAMER_WEBRTC_UDP_PORT 是宿主侧端口变量，默认与容器侧 8443 相同。
      - "${GAMER_WEBRTC_UDP_PORT:-8443}:8443/udp"
    volumes:
      # 运行数据唯一口径 = 仓库 server/data/：
      #   <包名>/tmpl|yaml 分区 = 随仓库分发的种子数据（克隆即得）；
      #   gamer.db 等运行期产物首次启动自动生成
      - ./server/data:/app/data
    environment:
      GB_CONFIG: /app/config.toml
      TZ: ${TZ:-Asia/Shanghai}
      GAMER_DEPLOYMENT_MODE: docker
      GAMER_WEBRTC_UDP_PORT: ${GAMER_WEBRTC_UDP_PORT:-8443}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8443/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # server's SIGTERM handler drains active runs/viewers/scrcpy before exit;
    # leave enough time for the 10s run drain grace plus socket cleanup.
    stop_grace_period: 30s
    restart: unless-stopped
    # USB 设备直通（物理手机场景）不放主文件：
    # 用 docker-compose.usb.yml override 承载 device 映射，网络类部署保持零特权

  # redroid 云手机（按需启用）
  redroid:
    image: redroid/redroid:12.0.0-latest
    container_name: redroid-phone
    privileged: true
    volumes:
      - ./redroid-data:/data
    ports:
      - "5555:5555"
    environment:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2400
      - androidboot.redroid_dpi=480
    restart: unless-stopped
    profiles: ["redroid"]
